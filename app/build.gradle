plugins { id 'com.android.application' }

android { namespace 'com.agenthitler'; compileSdk 35
    defaultConfig { applicationId 'com.agenthitler'; minSdk 30; targetSdk 35; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'arm64-v8a' } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '4.4.3' } }
    androidResources { noCompress 'gguf', 'model', 'fst', 'conf', 'arpa' }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    testImplementation 'junit:junit:4.13.2'
}
